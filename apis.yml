name: Partnered
description: >-
  Partnered was a cloud-based co-selling and partner-introductions platform that
  let sales teams request and exchange warm customer introductions with their
  partners' sales teams, enabling partner-powered co-selling at scale. Founded by
  Adam Michalski and Tim Sherwood and backed by Slow Ventures among other early
  investors, Partnered was acquired by Crossbeam on May 18, 2022, and its product
  was folded into Crossbeam's Ecosystem-Led Growth platform. The partnered.com
  domain now redirects to crossbeam.com; Partnered no longer operates as an
  independent company and exposes no independent public API surface.
